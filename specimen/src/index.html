<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">

        <title>Metreeca/Tile</title>

        <meta name="description" content="Tokens an interface is made of, and the base rules applying them to markup.">
        <meta name="copyright" content="&copy; 2023-2026 Metreeca">

        <link rel="icon" type="image/svg+xml" href="./index.svg"/>

        <style>

            :root {

                --tile--color-subtle: light-dark(#345, #9AB);
                --tile--color-strong: light-dark(#D60, #F80);

            }

            html, body {
                display: block;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            body:not(:has(*)) {
                display: block;
                width: 10vh;
                height: 10vh;
                margin: 40vh auto auto;
                overflow: visible;
                text-align: center;
                animation: loader-rotate 2s infinite linear;
            }

            body:not(:has(*))::before,
            body:not(:has(*))::after {
                content: '';
                position: absolute;
                left: 0;
                right: 0;
                width: 59%;
                height: 59%;
                display: inline-block;
                border-radius: 100%;
                animation: loader-bounce 2s infinite ease-in-out;
            }

            body:not(:has(*))::before {
                top: 0;
                background-color: var(--tile--color-strong);
            }

            body:not(:has(*))::after {
                bottom: 0;
                background-color: var(--tile--color-subtle);
                animation-delay: -1s;
            }

            @keyframes loader-rotate {
                100% {
                    transform: rotate(360deg);
                }
            }

            @keyframes loader-bounce {
                0%, 100% {
                    transform: scale(0.25);
                }
                50% {
                    transform: scale(1);
                }
            }

        </style>

        <script type="module" src="./index.tsx"></script>

    </head>

</html>
