<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">

        <title>Metreeca/Tile</title>

        <meta name="description" content="Tokens an interface is made of, and the base rules applying them to markup.">
        <meta name="copyright" content="&copy; 2023-2026 Metreeca">

        <link rel="icon" type="image/svg+xml" href="./index.svg"/>
        <link rel="license" href="https://www.apache.org/licenses/LICENSE-2.0"/>

        <script type="module" src="./index.tsx"></script>

        <style>

            @media (prefers-color-scheme: light) {

                :root {

                    --tile--color-accent-subtle: #345;
                    --tile--color-accent-strong: #D60;

                }

            }

            @media (prefers-color-scheme: dark) {

                :root {

                    --tile--color-accent-subtle: #9AB;
                    --tile--color-accent-strong: #F80;

                }

            }

            html, body, body > main, body > main > * {
                display: block;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            body > main:empty {
                display: block;
                width: 10vh;
                height: 10vh;
                margin: 40vh auto auto;
                overflow: visible;
                text-align: center;
                animation: loader-rotate 2s infinite linear;
            }

            body > main:empty::before,
            body > main:empty::after {
                content: '';
                position: absolute;
                left: 0;
                right: 0;
                width: 59%;
                height: 59%;
                display: inline-block;
                border-radius: 100%;
                animation: loader-bounce 2s infinite ease-in-out;
            }

            /*
             * The loader paints before the skin is loaded at all. It reads the accents off the pair stated above,
             * which is inline and so already in force on the first frame.
             */

            body > main:empty::before {
                top: 0;
                background-color: var(--tile--color-accent-strong);
            }

            body > main:empty::after {
                bottom: 0;
                background-color: var(--tile--color-accent-subtle);
                animation-delay: -1s;
            }

            @keyframes loader-rotate {
                100% {
                    transform: rotate(360deg);
                }
            }

            @keyframes loader-bounce {
                0%, 100% {
                    transform: scale(0.25);
                }
                50% {
                    transform: scale(1);
                }
            }

        </style>

    </head>

    <body>

        <main></main>

    </body>

</html>
