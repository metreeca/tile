<!DOCTYPE html>

<html lang="en">

    <head>

        <title>Metreeca/Tile</title>

        <meta name="description" content="The design system of the Metreeca stack: a layer of tokens naming what an interface is made of, and base rules applying them to plain document markup.">
        <meta name="copyright" content="&copy; 2023-2026 Metreeca">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">

        <link rel="icon" type="image/svg+xml" href="./index.svg"/>

        <script type="module" src="./index.tsx"></script>

        <style>

            :root {

                --specimen--color-accent-lite: #345;
                --specimen--color-accent-dark: #D60;

            }

            html, body, body > main, body > main > * {
                display: block;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            body > main:empty {
                display: block;
                width: 10vh;
                height: 10vh;
                margin: 40vh auto auto;
                overflow: visible;
                text-align: center;
                animation: loader-rotate 2s infinite linear;
            }

            body > main:empty::before,
            body > main:empty::after {
                content: '';
                position: absolute;
                left: 0;
                right: 0;
                width: 59%;
                height: 59%;
                display: inline-block;
                border-radius: 100%;
                animation: loader-bounce 2s infinite ease-in-out;
            }

            body > main:empty::before {
                top: 0;
                background-color: var(--specimen--color-accent-dark);
            }

            body > main:empty::after {
                bottom: 0;
                background-color: var(--specimen--color-accent-lite);
                animation-delay: -1s;
            }

            @keyframes loader-rotate {
                100% {
                    transform: rotate(360deg);
                }
            }

            @keyframes loader-bounce {
                0%, 100% {
                    transform: scale(0.25);
                }
                50% {
                    transform: scale(1);
                }
            }

        </style>

    </head>

    <body>

        <main></main>

    </body>

</html>
